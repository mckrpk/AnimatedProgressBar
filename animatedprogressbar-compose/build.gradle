apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.vanniktech.maven.publish'

kotlin {
    androidTarget {
        publishLibraryVariants('release')
        compilations.configureEach {
            kotlinOptions { jvmTarget = '17' }
        }
    }
    jvm {
        compilations.configureEach {
            kotlinOptions { jvmTarget = '17' }
        }
    }
    iosX64()
    iosArm64()
    iosSimulatorArm64()
    // ponytail: no wasmJs/js target yet, add when someone asks for web

    sourceSets {
        commonMain.dependencies {
            // Compose Multiplatform artifacts; on Android they resolve to androidx.compose 1.7.x
            api "org.jetbrains.compose.ui:ui:$compose_multiplatform_version"
            implementation "org.jetbrains.compose.foundation:foundation:$compose_multiplatform_version"
            implementation "org.jetbrains.compose.animation:animation-core:$compose_multiplatform_version"
        }
        androidMain.dependencies {
            // Theme colors and the deprecated overload taking the View's Style enum
            api project(':animatedprogressbar')
        }
    }
}

android {
    compileSdk 34

    namespace 'com.mckrpk.animatedprogressbar.compose'

    defaultConfig {
        // Jetpack Compose requires API 21
        minSdkVersion 21

        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
